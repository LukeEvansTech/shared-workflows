[project]
site_name = "Fixture Good"
site_description = "Conformant fixture"
site_author = "Tests"
site_url = "https://example.github.io/good/"
copyright = "Copyright 2026"
repo_url = "https://github.com/example/good"
repo_name = "example/good"
edit_uri = "edit/main/docs/docs/"

[project.theme]
name = "material"
variant = "modern"
language = "en"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

[markdown_extensions]
admonition = {}
toc = { permalink = true }

[markdown_extensions.pymdownx]
highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
inlinehilite = {}
snippets = {}

[markdown_extensions.pymdownx.superfences]
# Table form (NOT inline `superfences = {}`) so the custom fence actually registers.
# Enables ```mermaid blocks to render in the built zensical site; the Material theme
# auto-injects mermaid.js (from the unpkg CDN at runtime — needs browser network access).
custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }]
