---
# Canonical actionlint config.
#
# It lives under .github/linters/ because super-linter only reads linter configs
# from LINTER_RULES_PATH (.github/linters) -- it does NOT auto-discover a config
# at the repository root. That is the same constraint the markdownlint step in
# super-linter.yml works around by copying the root config into place.
# `.github/actionlint.yaml` is a symlink to this file so the standalone CLI and
# the raven-actions/actionlint job (both of which look at the root) read exactly
# the same rules -- one source of truth, no copy to keep in sync.
#
# actionlint 1.7.x does not yet model the `job.workflow_*` context properties
# (job.workflow_sha / job.workflow_repository / job.workflow_ref /
# job.workflow_file_path). They are real and documented -- GitHub's own contexts
# reference shows a reusable workflow using them to check out its own source:
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
# Remove this ignore once actionlint knows the properties.
paths:
  .github/workflows/zensical-drift-check.yml:
    ignore:
      - 'property "workflow_(sha|repository)" is not defined in object type'
