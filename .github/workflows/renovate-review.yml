---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Reusable: Claude reviews Renovate PRs for breaking changes and gates auto-merge
# via the `claude/renovate-review` commit status.
#
# This file owns the whole MECHANISM (classify -> tier -> fingerprint -> token
# pre-flight -> review -> status -> flags) and the generic two-thirds of the
# review prompt. Callers supply only what is genuinely repo-specific: the
# blast-radius regex, the commands the reviewer must never run, and a markdown
# context file describing the repo. See templates/renovate-review.yml.
#
# It replaces four hand-maintained ~700-line copies (talos-cluster, nut-apps,
# seedbox-apps, truenas-apps) that drifted apart twice in three weeks — once on
# 403 org-policy handling, once on 429 usage-limit handling. Fix things HERE.
name: Renovate Review (reusable)

on:
  workflow_call:
    inputs:
      context-file:
        description: >-
          Path, in the CALLING repo, to a markdown file describing the repo for
          the reviewer: what it deploys, how it deploys, which files consume a
          dependency, and which components are high-blast-radius. Spliced into
          the prompt in place of the generic "## Repository Context" section.

          Read from the PR's BASE commit, not the PR head — see the "Load repo
          context" step for why.
        type: string
        default: .github/renovate-review-context.md
      forbidden-commands:
        description: >-
          Human-readable list of commands the reviewer must never run, phrased to
          drop into a sentence — e.g. "kubectl, flux, talosctl, or cluster
          commands" or "docker, docker compose, doco-cd, ssh, or deploy
          commands". Appears twice in the prompt (opening statement + hard
          constraint).
        type: string
        required: true
      blast-regex:
        description: >-
          Alternation regex of high-blast-radius components, matched
          case-insensitively against the Renovate PR TITLE. A match always earns
          the deeper "full" review regardless of bump size. Ignored when
          `blast-from-renovaterc` is true.
        type: string
        default: ""
      blast-from-renovaterc:
        description: >-
          Derive `blast-regex` at runtime from the calling repo's
          `.renovaterc.json5` instead of taking it literally, so the workflow's
          blast list can never drift from the Renovate config. Requires a
          packageRules entry whose `description` byte-matches
          `protected-rule-description`.
        type: boolean
        default: false
      protected-rule-description:
        description: >-
          The `description` of the packageRules entry to derive the blast list
          from. Must byte-match, em dash included. Only used when
          `blast-from-renovaterc` is true.
        type: string
        default: "Protected infra — never auto-merge, manual review only"
      light-model:
        description: Model for the light (routine patch container bump) tier.
        type: string
        default: claude-sonnet-5
      full-model:
        description: Model for the full (minor/major/high-blast-radius) tier.
        type: string
        default: claude-opus-5
      max-turns:
        description: >-
          Turn ceiling for the reviewer. A ceiling, not a target — it costs
          nothing when a review finishes early, and the prompt still aims at
          12-18 turns. Full-depth reviews have broken 25 (2026-07-31) and 35
          (a 50-turn Opus review, 2026-08-10); overrunning it AFTER the verdict
          is posted still fails the action, which trains you to ignore red runs.
        type: number
        default: 60
      ungated-labels:
        description: >-
          Renovate labels that skip review entirely (low blast radius, already
          trusted by the auto-merge presets). Alternation regex matched with
          `grep -qwE` against the PR's labels.
        type: string
        default: type/digest|renovate/github-action
      runner:
        description: >-
          Runner label the job executes on. Defaults to `ubuntu-latest`
          (GitHub-hosted), which consumes billable Actions minutes on private
          repos. Set this to the name of an ARC runner scale set to run the job
          on the Talos cluster instead, where minutes are free.

          The scale set must already exist and its listener must be Running
          BEFORE a caller sets this — a job requesting a label no runner
          advertises queues indefinitely rather than failing, so it looks hung
          rather than broken.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: >-
          Job timeout. Opus full-depth reviews run long; a job timeout
          mid-review hits the fail-open path (PR passes unreviewed), so don't
          trim this without also tightening the status step.
        type: number
        default: 30
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          Claude Code OAuth token (`claude setup-token`). Required. An absent or
          dead token fails the review CLOSED — the PR blocks rather than
          auto-merging unreviewed.
        required: true

jobs:
  review:
    name: Breaking Change Analysis
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # The CALLER must grant at least these scopes on its job, or the run fails
    # with startup_failure. Declared here too so the effective set is explicit.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify PR
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # user.login from the webhook payload is "renovate[bot]"; gh pr view returns "app/renovate".
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          UNGATED: ${{ inputs.ungated-labels }}
        run: |
          pr_json=$(gh pr view "$PR" --json labels)
          labels=$(echo "$pr_json" | jq -r '[.labels[].name] | join(" ")')

          is_renovate=false
          gated=false

          if [[ "$PR_AUTHOR" == "renovate[bot]" ]]; then
            is_renovate=true
            # Ungated = low blast radius, already trusted by the auto-merge
            # presets (digest-only bumps, GitHub Actions bumps). Everything else
            # from Renovate is gated for review.
            if echo "$labels" | grep -qwE "$UNGATED"; then
              gated=false
            else
              gated=true
            fi
          fi

          {
            echo "is_renovate=$is_renovate"
            echo "gated=$gated"
            echo "labels=$labels"
          } >> "$GITHUB_OUTPUT"
          echo "author=$PR_AUTHOR labels=$labels -> is_renovate=$is_renovate gated=$gated"

      - name: Extract protected-infra blast list
        id: blast
        if: steps.gate.outputs.gated == 'true' && inputs.blast-from-renovaterc
        env:
          # Must byte-match the `description` of the protected-infra packageRules
          # entry in the caller's .renovaterc.json5 — the single source of truth
          # for which components are critical. Everything below derives from it so
          # the workflow's blast-radius list can never drift from that config.
          RULE_DESCRIPTION: ${{ inputs.protected-rule-description }}
        run: |
          set -uo pipefail
          # json5 converts the JSON5 config to plain JSON so jq can read it. Each
          # matchPackageNames entry is a JS regex literal like "/cilium/" or
          # "/fluxcd\\//" (escaped slash) — strip the leading/trailing "/"
          # delimiters and join with "|" into one alternation regex.
          #
          # This regex is matched against the Renovate PR *title*, not a raw
          # package name. Grouped updates (Flux/Talos/Kubernetes/Rook-Ceph/...)
          # get a title built from the group's human-readable `groupName`
          # ("update Talos group (...)"), which doesn't always textually
          # contain its members' matchPackageNames pattern (e.g. groupName
          # "Talos" vs pattern "siderolabs\/", groupName "Flux" vs pattern
          # "fluxcd\/"). So also pull in the groupName of every packageRule
          # that shares a matchPackageNames entry with the protected-infra
          # rule, or those grouped bumps would silently under-match.
          npx --yes json5@2 .renovaterc.json5 > /tmp/renovaterc.json
          blast=$(jq -r --arg desc "$RULE_DESCRIPTION" '
              (.packageRules[] | select(.description == $desc) | .matchPackageNames) as $protected
              | (
                  $protected[],
                  (.packageRules[]
                    | select(.groupName != null and (.matchPackageNames // [] | any(. as $p | $protected | index($p) != null)))
                    | .groupName)
                )
            ' /tmp/renovaterc.json 2>/dev/null \
            | sed -E 's#^/(.*)/$#\1#' \
            | sort -u \
            | paste -sd '|' -)
          if [[ -z "$blast" ]]; then
            echo "::error::Could not find the protected-infra packageRules entry (description=\"$RULE_DESCRIPTION\") in .renovaterc.json5 — refusing to fall back to an empty blast-radius regex" >&2
            exit 1
          fi
          echo "blast=$blast" >> "$GITHUB_OUTPUT"
          echo "Derived blast-radius regex ($(echo "$blast" | tr '|' '\n' | wc -l | tr -d ' ') components): $blast"

      - name: Select model tier
        id: model_tier
        if: steps.gate.outputs.gated == 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ steps.gate.outputs.labels }}
          # Derived list wins when blast-from-renovaterc is on; otherwise the
          # literal input. One of the two is always non-empty (see the guard).
          BLAST: ${{ inputs.blast-from-renovaterc && steps.blast.outputs.blast || inputs.blast-regex }}
          LIGHT_MODEL: ${{ inputs.light-model }}
          FULL_MODEL: ${{ inputs.full-model }}
        run: |
          set -uo pipefail
          blast="$BLAST"
          # An empty blast regex would make `grep -qiE ""` match EVERY title, so
          # every bump would silently take the light tier's negated branch and
          # land on full — expensive but safe — or, worse, a future refactor
          # inverts it and nothing gets deep review. Fail loudly instead.
          if [[ -z "$blast" ]]; then
            echo "::error::No blast-radius regex: set the 'blast-regex' input, or 'blast-from-renovaterc: true' with a matching packageRules entry" >&2
            exit 1
          fi

          # Light tier for routine patch container bumps (it decides for itself
          # whether to escalate to full depth, so it needs real judgment); full
          # tier for everything else (minor/major, chart upgrades,
          # github-release, high-blast-radius components).
          echo "blast=$blast" >> "$GITHUB_OUTPUT"

          if echo "$LABELS" | grep -qw 'type/patch' \
            && echo "$LABELS" | grep -qw 'renovate/container' \
            && ! echo "$TITLE" | grep -qiE "$blast"; then
            echo "model=$LIGHT_MODEL" >> "$GITHUB_OUTPUT"
            echo "depth=light" >> "$GITHUB_OUTPUT"
          else
            echo "model=$FULL_MODEL" >> "$GITHUB_OUTPUT"
            echo "depth=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Fingerprint check
        id: fp
        if: steps.gate.outputs.gated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          USAGE_MARKER: "<!-- claude-renovate-usage -->"
        run: |
          set -uo pipefail
          # NOTE: GitHub runs run-steps with `bash -e` (errexit), and `set -uo
          # pipefail` does NOT disable it. So every fallible command below needs an
          # explicit `|| true`, or the step dies. In particular `grep` exits 1 when
          # there's no stored fingerprint yet (first review of a PR) - that is the
          # expected path, not an error.
          #
          # Renovate rebases its branches onto fresh main constantly without
          # changing the actual version bump. When the effective PR diff is
          # byte-identical to the last reviewed diff, skip the (paid) Claude step
          # entirely and let the status step re-post the prior verdict. This is a
          # PRE-LLM gate: the prompt has its own "skip redundant re-reviews" check,
          # but that one still spins Claude up and burns turns to decide to skip.
          fingerprint=$(gh pr diff "$PR" 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
          fingerprint="${fingerprint:-none}"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

          # Stored fingerprint lives in a hidden marker inside the sticky usage
          # comment, written by report-claude-usage.sh only when a real review ran.
          # grep exits 1 on no match (first run) -> guard with || true.
          stored=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login==\"github-actions[bot]\" and (.body|contains(\"$USAGE_MARKER\")))] | last | .body // \"\"" \
            2>/dev/null | grep -oE 'fingerprint:[0-9a-f]{64}' | head -1 | cut -d: -f2 || true)

          # A prior verdict must exist for the skip to be safe — the status step
          # re-derives success/failure from it.
          #
          # DISMISSED reviews must count here. The baseline-main-protection ruleset
          # sets dismiss_stale_reviews_on_push:true, so every Renovate push to the
          # branch erases the APPROVED/CHANGES_REQUESTED state of Claude's earlier
          # review. The body survives and still carries the "**Verdict**:" line, so
          # re-derive the verdict from that.
          #
          # Without this the gate could never see a prior verdict after a rebase:
          # skip stayed false, Claude spun up, found its own prior review for an
          # unchanged diff and — per the prompt's "skip redundant re-reviews" rule —
          # deliberately posted nothing. The status step then failed the PR with
          # "Claude finished without posting a verdict". That is a permanent
          # deadlock: the diff never changes again, so no future run can escape it.
          # (Observed on 7 PRs across nut-apps/talos-cluster; note the ruleset sets
          # required_approving_review_count:0, so the dismissal gates nothing — its
          # only effect was to break this cache.)
          #
          # Parsing is scoped to the verdict LINE and tests "Changes required"
          # before "Safe to merge", so it fails closed: a dismissed change-request
          # still blocks, an unparsable body yields "" and is not reused.
          prior=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.user.login=="claude[bot]" or .user.login=="github-actions[bot]")
                  | select(.state=="APPROVED" or .state=="CHANGES_REQUESTED" or .state=="DISMISSED")]
                  | last
                  | if . == null then ""
                    elif .state != "DISMISSED" then .state
                    else ((((.body // "") | capture("Verdict\\*\\*:[ \t]*(?<v>[^\n]*)")? | .v) // "")
                      | if test("Changes required") then "CHANGES_REQUESTED:dismissed"
                        elif test("Safe to merge") then "APPROVED:dismissed"
                        else "" end)
                    end' \
            2>/dev/null || true)

          skip=false
          if [[ -n "$stored" && "$stored" == "$fingerprint" && -n "$prior" ]]; then
            skip=true
          fi
          echo "skip_claude=$skip" >> "$GITHUB_OUTPUT"
          echo "current=$fingerprint stored=${stored:-none} prior=${prior:-none} -> skip_claude=$skip"

      - name: Load repo context
        id: ctx
        if: steps.gate.outputs.gated == 'true' && steps.fp.outputs.skip_claude != 'true'
        env:
          CONTEXT_FILE: ${{ inputs.context-file }}
          # Read the context from the PR's BASE commit, never the checked-out PR
          # head. The context file IS part of the reviewer's instructions, so
          # taking it from the head would let a pull request rewrite the rules it
          # is about to be judged by. Renovate PRs never touch it, so this costs
          # nothing in practice and closes the hole for anything that does.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          # fetch-depth:0 usually brings the base commit along with the PR merge
          # ref, but a freshly-pushed or force-pushed base can miss. Fetch it
          # rather than mistaking "object not present" for "file not found".
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null \
            || true
          if ! context=$(git show "$BASE_SHA:$CONTEXT_FILE" 2>/dev/null); then
            echo "::error::Repo context file '$CONTEXT_FILE' not found at base commit $BASE_SHA. Add it on the default branch (see templates/renovate-review-context.md in shared-workflows) — refusing to review with an empty repo context." >&2
            exit 1
          fi
          if [[ -z "${context//[[:space:]]/}" ]]; then
            echo "::error::Repo context file '$CONTEXT_FILE' is empty — refusing to review with an empty repo context." >&2
            exit 1
          fi
          # Multiline step output needs the random-delimiter form.
          delim="CTX_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          {
            echo "context<<$delim"
            printf '%s\n' "$context"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "Loaded $(printf '%s\n' "$context" | wc -l | tr -d ' ') lines of repo context from $CONTEXT_FILE@$BASE_SHA"

      - name: Validate OAuth token
        id: token_check
        if: steps.gate.outputs.gated == 'true' && steps.fp.outputs.skip_claude != 'true'
        env:
          # Same rationale as the claude step: a deployment environment would only
          # block this per-PR automation; super-linter's pinned zizmor 1.23.1 emits
          # this (1.25 suppresses it by default). Suppressed with justification.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]
        run: |
          set -uo pipefail
          # Deterministic pre-flight: confirm the OAuth token still authenticates
          # BEFORE spending a review. The reviewer fails OPEN on transient Claude
          # errors (so a blip doesn't wedge auto-merge), which would otherwise let
          # an EXPIRED/REVOKED token silently pass PRs through unreviewed. This step
          # closes that gap: a clean 401 is flagged loudly and blocks (fail closed);
          # 429 (usage window spent) blocks too, with a re-run as the fix (see the
          # case arm); 400/5xx/timeout is "inconclusive" (our request or the
          # network, not the token) so header/model drift can never false-flag.
          #
          # sk-ant-oat01 OAuth tokens authenticate via `Authorization: Bearer`
          # (NOT x-api-key — that returns 401 "invalid x-api-key" even for a valid
          # OAuth token) and require the oauth-2025-04-20 beta header.
          code=$(curl -sS -o /tmp/tokresp.json -D /tmp/tokhdr.txt -w '%{http_code}' \
            --max-time 30 \
            -X POST https://api.anthropic.com/v1/messages \
            -H "Authorization: Bearer ${CLAUDE_CODE_OAUTH_TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: oauth-2025-04-20" \
            -H "content-type: application/json" \
            -d '{"model":"claude-sonnet-5","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' \
            2>/dev/null || echo "000")

          err_type=$(jq -r '.error.type // ""' /tmp/tokresp.json 2>/dev/null || echo "")
          case "$code" in
            200) state=valid ;;
            401) state=invalid ;;
            # 403 permission_error is the org-policy denial: the token authenticates
            # but the Claude organization behind it has disabled Claude subscription
            # access for Claude Code ("oauth_org_not_allowed"). No retry ever changes
            # that, so it is exactly as dead as a revoked token and must fail CLOSED.
            # Left on the inconclusive path it does the opposite of its job: the
            # reviewer errors, the status step takes its pass-through branch, and
            # every gated PR goes green unreviewed (observed 2026-07-31).
            # Any OTHER 403 stays inconclusive — that is not a statement about the token.
            403)
              if [[ "$err_type" == "permission_error" ]]; then
                state=invalid
              else
                state=inconclusive
              fi
              ;;
            # 429 rate_limit_error: the token is alive but the Claude subscription
            # behind it has spent its usage window, which can stay shut for hours.
            # Left inconclusive it rides the pass-through path and every gated PR
            # goes green unreviewed until the window resets — three PRs on
            # 2026-08-17, two of them auto-merge eligible. Fail CLOSED like a dead
            # token; the fix is a re-run once the window resets, not a rotation.
            429) state=rate-limited ;;
            *) state=inconclusive ;;
          esac
          # On a 401, only a genuine authentication_error counts as a dead token;
          # anything else downgrades to inconclusive so we never block on our own
          # request. The 403 arm above has already qualified its own error type.
          if [[ "$state" == "invalid" && "$code" == "401" && -n "$err_type" && "$err_type" != "authentication_error" ]]; then
            state=inconclusive
          fi
          # Which failure it is decides what the operator has to DO about it, so
          # carry the distinction through to the status and the annotation.
          reason=""
          detail=""
          if [[ "$state" == "invalid" ]]; then
            if [[ "$code" == "403" ]]; then
              reason="org-policy"
            else
              reason="expired-or-revoked"
            fi
          elif [[ "$state" == "rate-limited" ]]; then
            # Two very different failures share type=rate_limit_error, and they
            # need opposite advice — so tell them apart before writing any.
            #
            #   * A real rate limit carries `retry-after` (seconds) and/or the
            #     anthropic-ratelimit-*-reset headers (RFC 3339). A re-run once
            #     it reopens is the fix.
            #   * Hitting the ORG SPEND CAP returns the same error type with NO
            #     retry-after, and access does not resume until 00:00 UTC on the
            #     1st of the next month. `error.details.error_code` is
            #     `enforced_spend_limit_reached`. Re-running is useless here, so
            #     saying "re-run once the window resets" is actively misleading.
            #
            # Header names are the documented ones (platform.claude.com/docs/en/
            # api/rate-limits, "Response headers"); .error.message is NOT a
            # reliable source — on 2026-08-23 it was literally "Error".
            err_code=$(jq -r '.error.details.error_code // ""' /tmp/tokresp.json 2>/dev/null || echo "")
            msg=$(jq -r '(.error.message // .message // empty)' /tmp/tokresp.json 2>/dev/null | head -c 120 || true)
            if [[ "$err_code" == "enforced_spend_limit_reached" ]]; then
              reason="spend-cap"
              detail="${msg:-organization monthly spend cap reached}"
            else
              reason="usage-limit"
              retry=$(grep -iE '^retry-after:' /tmp/tokhdr.txt 2>/dev/null | head -1 | cut -d: -f2- | tr -d '\r' | xargs || true)
              reset=$(grep -iE '^anthropic-ratelimit-(requests|tokens|input-tokens|output-tokens)-reset:' \
                /tmp/tokhdr.txt 2>/dev/null | head -1 | cut -d: -f2- | tr -d '\r' | xargs || true)
              if [[ "$retry" =~ ^[0-9]+$ ]]; then
                detail="retry in $(( (retry + 59) / 60 ))m"
              elif [[ -n "$reset" ]]; then
                detail="resets $reset"
              else
                # Neither header present: not a per-minute limit. Most likely a
                # subscription/Claude-Code usage window, which reopens on its own
                # schedule and tells us nothing here.
                detail="${msg:-no reset time returned}"
              fi
            fi
            detail=$(printf '%s' "$detail" | head -c 100)
            # Log what actually came back, so the next shape change is
            # diagnosable from the run instead of by archaeology.
            echo "429 err_code=${err_code:-none} reason=$reason"
            echo "429 rate-limit headers:"
            grep -iE '^(anthropic-ratelimit|anthropic-priority|retry-after)' /tmp/tokhdr.txt 2>/dev/null | sed 's/^/  /' || echo "  (none present)"
            echo "429 body (first 300 chars): $(head -c 300 /tmp/tokresp.json 2>/dev/null | tr -d '\n')"
          fi
          {
            echo "token_state=$state"
            echo "token_reason=$reason"
            echo "token_detail=$detail"
          } >> "$GITHUB_OUTPUT"
          echo "http=$code err_type=${err_type:-none} -> token_state=$state reason=${reason:-none} detail=${detail:-none}"

      - id: claude
        if: >-
          steps.gate.outputs.gated == 'true'
          && steps.fp.outputs.skip_claude != 'true'
          && steps.token_check.outputs.token_state != 'invalid'
          && steps.token_check.outputs.token_state != 'rate-limited'
        uses: anthropics/claude-code-action@24dcd50c0568f0fc9e9211213a4fd2d9eb15c4e0 # v1.0.200
        with:
          # zizmor secrets-outside-env wants a GitHub deployment environment, but this
          # review runs on every Renovate PR branch: an environment with protection rules
          # would block the automation, and one without adds a config surface that
          # protects nothing. The token is a read-scoped Claude OAuth token, not a cloud
          # credential. Suppressed with justification.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]
          allowed_bots: "renovate[bot]"
          show_full_output: true
          # (Comments cannot live inside claude_args — it is a literal block whose
          # lines are passed to the CLI as arguments. See the `max-turns` input
          # for why the ceiling is where it is.)
          claude_args: |
            --model ${{ steps.model_tier.outputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --setting-sources user
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh issue view:*),Bash(gh api:*),Bash(gh release view:*),Bash(gh release list:*),Bash(gh repo view:*),Bash(git log:*),Bash(git show:*),Bash(git tag:*),Bash(curl:*),WebFetch,WebSearch"
          prompt: |
            You research dependency upgrades in Renovate pull requests and submit a GitHub PR review
            with your findings. You do not make changes to files, do not merge PRs, and do not run
            any ${{ inputs.forbidden-commands }}. You investigate and report only.

            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            REVIEW DEPTH: ${{ steps.model_tier.outputs.depth }}

            ${{ steps.ctx.outputs.context }}

            ## High-Blast-Radius Components

            These are the components this repo treats as critical — a bump matching any of them
            always earns the deeper review, and this is the exact list the depth tier was chosen
            from:

            ```
            ${{ steps.model_tier.outputs.blast }}
            ```

            Anything in the diff matching one of those — or, even if it doesn't match, still
            clearly touching the same concerns (networking, storage, secrets/certs, the GitOps
            engine, or the node/host OS) — warrants the deeper review regardless of the assigned
            depth tier. Check for data migrations, CRD-compatibility breaks, and
            reconciliation-affecting changes in particular.

            ## Pre-check: skip redundant re-reviews

            Before doing any research, check whether claude[bot] has already reviewed this PR
            (`gh pr view <n> --json reviews` or `gh api repos/<owner>/<repo>/pulls/<n>/reviews`). If a
            prior review exists, compare the package version(s) in the current diff against the
            versions mentioned in that review. If they are identical (i.e. Renovate just rebased
            without changing versions), stop immediately without posting a new review. Only proceed
            with a full review if the versions changed or new packages were added since the last review.

            ## Tool Use Efficiency

            When you need multiple independent read-only lookups — Grep/Glob/Read on repo files,
            git log, or independent gh api calls — issue them as parallel tool calls in a single
            turn rather than one at a time. For example, `gh pr view`, `gh api .../reviews`, and
            `git log --grep` can all be issued in the same turn.

            ## Shell & Tool Conventions

            The allowed toolset is intentionally narrow. Violating these rules causes immediate
            "requires approval" errors that waste turns and may exhaust the turn budget:

            - **Always quote `gh api` URLs** that contain `?`, `&`, or `+`. An unquoted `&` is a
              shell operator that splits the command into fragments — most will be denied. For
              upstream-issue searches use the `search/issues` endpoint with `+`-joined qualifiers:
              `gh api "search/issues?q=repo:org/repo+label:bug+v1.20.0&per_page=20"`
            - **Filter JSON with `--jq`, not pipes to `python3` or `jq`**. Only `gh`, `git`,
              `grep`, and `curl` are on the allowlist; piping to anything else is denied.
              Correct: `gh api "repos/org/repo/releases/tags/v1.0" --jq '.body'`
            - **Run `git` without `-C <path>`**. The checkout is already the working directory;
              use plain `git log`, `git show`, `git tag` (all allowlisted). The flag
              `git -C /abs/path ...` does not prefix-match the allowlist and is denied.
            - **Read upstream issues with `gh issue view <n> --repo <org>/<repo>`** (allowlisted)
              or `gh api repos/<org>/<repo>/issues/<n> --jq`. Do not use `gh issue list` (not
              on the allowlist); use `gh api "search/issues?q=repo:org/repo+..."` instead.

            ## Review Depth

            Your depth for this PR is **${{ steps.model_tier.outputs.depth }}**:

            **light** — routine patch container bump:
            1. Analyze (step 1 below).
            2. Read the PR body for Renovate-embedded release notes. If present and covering the
              full old→new range, use them. Otherwise fetch the upstream releases for that range
              with a single `gh api` call.
            3. Grep/Read the repo files that reference this component (step 3 below).
            4. Submit verdict.
            Skip the multi-source breadcrumb chase (CHANGELOG files, docs sites, commit history,
            registry metadata, web search) and the upstream-issues search UNLESS the release notes
            show breaking changes, deprecations, or security fixes — then escalate to full depth.
            Target: 5–7 turns.

            **full** — minor/major bump, chart upgrade, or high-blast-radius component:
            Follow the complete Workflow below without shortcuts. Target: 12–18 turns.

            ## Workflow

            ### 1. Analyze

            Fetch PR details with `gh pr view`. Identify:
            - What is being upgraded (container image, Helm chart, GitHub Action, tool, etc.)
            - The old and new version
            - Whether this is a wrapper that bundles another component (a Docker image wrapping
              upstream software, a Helm chart wrapping an application). Identify the inner
              component and its version change too.

            ### 2. Research

            Trace the dependency chain to its origin. Changelogs live at the source, not always at
            the wrapper. A Docker image bump from v1.2 to v1.3 might re-wrap an upstream tool that
            jumped from 4.0 to 5.0; the meaningful changelog is the upstream one.

            Follow breadcrumbs systematically. When one source is a dead end, try the next:
            - **PR body**: Check for linked release notes; start there.
            - **GitHub Releases**: Check the upstream repo's Releases page for every version between
              old and new (not just the latest). Migration notes often appear in intermediate releases.
            - **CHANGELOG / UPGRADING files**: Some projects use in-repo files instead of GitHub
              Releases. Check the repo root and docs/ directory.
            - **Wrapper changelogs**: For wrapper upgrades (charts, images, meta-packages), check
              changelogs for both the wrapper AND the underlying component separately.
            - **Documentation sites**: Search for migration guides or "what's new" pages for
              deprecation notices not mentioned in changelogs.
            - **Commit history**: If no changelog exists, scan commit messages between the two
              tags/versions for keywords: breaking, deprecat, remov, renam, migrat, drop, require.
            - **Registry metadata**: When a repo has no releases or changelog, check the README or
              container registry (Docker Hub, GHCR, quay.io) for links to the upstream project.
            - **Web search**: Last resort for hard-to-find changelogs or community migration reports.
            - **Upstream issues**: After reviewing release notes, search the upstream repo's GitHub
              issues for open bugs or regressions reported against the new version. Use
              `gh api "search/issues?q=repo:org/repo+label:bug+VERSION"` or WebSearch for issues
              referencing the version number. This catches regressions that ship before being
              documented in a changelog.

            Do not stop at the first source. Cross-reference multiple sources.

            ### 3. Assess Impact

            Read the files in this repository that reference or consume the upgraded component —
            the Repository Context section above says where those live and what they look like.

            Map each finding from the research step against what this repository actually uses. A
            breaking change that affects a feature or flag we don't set is not actionable. Pay
            particular attention to: renamed/removed environment variables or command flags,
            changed default ports or config-file schema, data migrations, CRD-compatibility breaks,
            and volume/permission changes that a redeploy would not migrate automatically.

            ### 4. Categorize

            Sort actionable findings into four buckets:
            - **Breaking changes**: Incompatibilities requiring repo changes before or alongside
              this upgrade
            - **Deprecations**: Treat identically to breaking changes; update usage now rather than
              relying on deprecated behavior
            - **New features**: Capabilities worth adopting (simplifies config, eliminates
              workarounds, improves functionality)
            - **Known issues**: Open bugs or regressions reported against this version in the
              upstream issue tracker that could affect this repo

            ## Submitting the Review

            Submit your findings as a single GitHub PR review.

            **If there are breaking changes or deprecations that affect this repo**:
            Use `gh pr review --request-changes` with a structured body.

            **If the upgrade is safe** (no actionable findings):
            Use `gh pr review --approve` with a brief summary.

            Structure the review body as follows (omit empty sections):

            ```
            ### [package]: vOLD → vNEW

            **Verdict**: Safe to merge | Changes required before merge

            **Breaking changes**:
            - [What changed] — introduced in [version]. Affects `path/to/file`. Fix: [brief description]

            **Deprecations**:
            - [Same detail as above]

            **New features worth adopting**:
            - [Feature] — [benefit]. Would change `path/to/file`.

            **Known issues**:
            - [Issue title/link] — [brief description of impact]

            **Not applicable to this repo**:
            - [Finding] — [why it doesn't apply]

            **Sources consulted**:
            - [URLs]
            ```

            ## Constraints

            - NEVER modify repository files — read-only investigation only
            - NEVER merge the PR, approve merges, or run ${{ inputs.forbidden-commands }}, or
              anything else that mutates the running system
            - Check git history for context: `git log --oneline --grep="<package>" -n 10`
            - If unclear, research more rather than guess
            - When stuck (private repo, ambiguous package, no changelog anywhere), report what you
              found and what you could not find rather than fabricating information
            - Submit exactly one `gh pr review` at the end of your analysis
            - When citing github.com URLs in the review body (PRs, issues, commits, releases, file
              or blob links), rewrite the host to `redirect.github.com` while keeping the full
              `https://` scheme (e.g. `https://redirect.github.com/rook/rook/releases/tag/v1.20.0`).
              This suppresses the cross-reference backlinks that would otherwise spam every linked
              issue/PR with a "mentioned in" notification. Non-github.com URLs are unaffected.

      - name: Publish review status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_RENOVATE: ${{ steps.gate.outputs.is_renovate }}
          GATED: ${{ steps.gate.outputs.gated }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          SKIP: ${{ steps.fp.outputs.skip_claude }}
          TOKEN_STATE: ${{ steps.token_check.outputs.token_state }}
          TOKEN_REASON: ${{ steps.token_check.outputs.token_reason }}
          TOKEN_DETAIL: ${{ steps.token_check.outputs.token_detail }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          context="claude/renovate-review"

          if [[ "$IS_RENOVATE" != "true" ]]; then
            # Human PR or non-Renovate author - not gated.
            state="success"
            desc="Not a Renovate PR - skipped"
          elif [[ "$GATED" != "true" ]]; then
            # Digest-only or GitHub Actions bump - ungated, pass through.
            state="success"
            desc="Ungated update type (digest/github-actions) - auto-approved"
          elif [[ "$TOKEN_STATE" == "invalid" ]]; then
            # Dead token: no review happened. Fail closed and block - the run also
            # fails red via the "Flag invalid token" step below. The two reasons need
            # different fixes, so say which one this is: rotating the token is useless
            # against an org-policy denial, which needs a different ACCOUNT.
            state="failure"
            if [[ "$TOKEN_REASON" == "org-policy" ]]; then
              desc="Claude Code disabled for this token's org - re-mint from an allowed account (review skipped)"
            else
              desc="OAuth token invalid/expired/revoked - rotate CLAUDE_CODE_OAUTH_TOKEN (review skipped)"
            fi
          elif [[ "$TOKEN_STATE" == "rate-limited" ]]; then
            # Nothing ran, so there is no verdict to read. Fail closed either way,
            # but a spend-cap 429 is not fixed by a re-run — say which it is.
            state="failure"
            if [[ "$TOKEN_REASON" == "spend-cap" ]]; then
              desc="Claude spend cap reached - raise the limit or wait for next month${TOKEN_DETAIL:+: $TOKEN_DETAIL}"
            else
              desc="Claude usage limit hit (429) - re-run once the window resets${TOKEN_DETAIL:+: $TOKEN_DETAIL}"
            fi
          else
            # Gated version bump - read the latest verdict. Works for fresh runs
            # AND fingerprint-skips (the prior review is still on the PR).
            # Same DISMISSED-aware resolver as the fingerprint gate above — see the
            # long comment there for why. Emits "<STATE>" for a live review or
            # "<STATE>:dismissed" when the verdict had to be recovered from the body
            # of a review that dismiss_stale_reviews_on_push wiped.
            resolved=""
            for attempt in 1 2 3; do
              resolved=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                --jq '[.[] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]")
                      | select(.state=="APPROVED" or .state=="CHANGES_REQUESTED" or .state=="DISMISSED")]
                      | last
                      | if . == null then ""
                        elif .state != "DISMISSED" then .state
                        else ((((.body // "") | capture("Verdict\\*\\*:[ \t]*(?<v>[^\n]*)")? | .v) // "")
                          | if test("Changes required") then "CHANGES_REQUESTED:dismissed"
                            elif test("Safe to merge") then "APPROVED:dismissed"
                            else "" end)
                        end' 2>/dev/null || echo "")
              [[ -n "$resolved" ]] && break
              echo "Attempt $attempt: resolved='' - retrying in 5s..."
              sleep 5
            done
            review_state="${resolved%%:*}"
            verdict_origin="${resolved#*:}"
            [[ "$verdict_origin" == "$resolved" ]] && verdict_origin="live"
            echo "Resolved verdict: state='$review_state' origin='$verdict_origin'"

            if [[ "$review_state" == "APPROVED" ]]; then
              state="success"
              if [[ "$verdict_origin" == "dismissed" ]]; then
                desc="Claude approved - no breaking changes (verdict recovered from dismissed review)"
              else
                desc="Claude approved - no breaking changes found"
              fi
            elif [[ "$review_state" == "CHANGES_REQUESTED" ]]; then
              state="failure"
              desc="Claude requested changes - manual review required"
            elif [[ "$SKIP" == "true" ]]; then
              # Diff unchanged but the prior verdict vanished (review dismissed?).
              # Don't hard-block on a bookkeeping gap.
              state="success"
              desc="Diff unchanged since last review - prior verdict reused"
            elif [[ "$CLAUDE_OUTCOME" == "success" ]]; then
              # Claude ran cleanly but never posted a verdict (e.g. hit max-turns).
              # This is an anomaly worth a human look, not a transient blip - fail.
              state="failure"
              desc="Claude finished without posting a verdict - review manually"
            elif [[ "$CLAUDE_OUTCOME" == "skipped" ]]; then
              # The Claude step's own `if:` already rules out the two legitimate
              # skip reasons above (fingerprint SKIP, TOKEN_STATE invalid/rate-
              # limited) and GATED is 'true' here - so a skip at this point can
              # only mean a prerequisite step upstream (blast list, model tier,
              # fingerprint check, repo context, token validation) failed and
              # GitHub Actions' implicit success() gating skipped everything
              # after it, Claude included. Claude never got a chance to run, so
              # there is no verdict to pass through - fail closed like every
              # other "Claude didn't review this" case, per the fail-closed
              # design this workflow exists to enforce (see CLAUDE.md).
              state="failure"
              desc="A prerequisite step failed before Claude could run - check the workflow run, review manually"
            else
              # Claude step actually started and then errored/was cancelled with
              # no verdict posted. The usage window can also run out MID-review
              # (the pre-flight passed, a later turn got 429): the action's
              # result record then carries api_error_status=429 and the reset
              # time. That is the same hours-long outage as the pre-flight case,
              # so fail closed on it. Anything else (API blip, timeout) is a
              # genuine transient failure != changes-requested: pass through so
              # the auto-merge pipeline isn't wedged. Surfaced in the status for
              # audit either way.
              limit_msg=""
              if [[ -n "${EXEC_FILE:-}" && -f "$EXEC_FILE" ]]; then
                limit_msg=$(jq -r 'map(select(.type=="result")) | last | select(.api_error_status == 429) | .result // "429"' \
                  "$EXEC_FILE" 2>/dev/null | head -c 100 || true)
              fi
              if [[ -n "$limit_msg" ]]; then
                state="failure"
                desc="Claude usage limit hit mid-review (429) - re-run once the window resets: ${limit_msg}"
              else
                state="success"
                desc="Claude review errored (outcome=${CLAUDE_OUTCOME:-none}) - passed through, review manually"
              fi
            fi
          fi

          # The statuses API rejects descriptions over 140 chars (422), which
          # would drop the gate entirely - clamp rather than fail.
          desc="${desc:0:140}"
          echo "Posting commit status: context=$context state=$state desc=$desc"
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context="$context" \
            -f description="$desc" \
            -f target_url="$RUN_URL"

      # Check out THIS workflow's own commit for the usage reporter, not `main`.
      # Callers pin us by SHA (`@<sha> # v1`), but that pin covers only this YAML
      # file — a `ref: main` checkout would fetch the script unpinned, so any
      # commit to main would change the behaviour of every calling repository at
      # once and the callers' pins would give false assurance.
      #
      # Deliberately placed AFTER the claude step so the reviewer never sees this
      # directory in its Glob/Grep of the repo. The dotted path keeps it clear of
      # anything a caller might have at the workspace root.
      - name: Checkout usage reporter
        if: always() && steps.gate.outputs.gated == 'true' && steps.fp.outputs.skip_claude != 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - name: Log usage
        # Skip when the Claude step was skipped (diff unchanged): there's no new
        # usage to report, and rewriting the sticky comment would drop the stored
        # fingerprint and defeat the next skip.
        if: always() && steps.gate.outputs.gated == 'true' && steps.fp.outputs.skip_claude != 'true'
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          MODEL: ${{ steps.model_tier.outputs.model }}
          FINGERPRINT: ${{ steps.fp.outputs.fingerprint }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .shared-workflows/scripts/report-claude-usage.sh

      - name: Flag invalid token
        # Dead OAuth token: make the run go red with an annotation so it can't be
        # missed (the commit status already blocks the PR). This is the loud,
        # in-action signal that the token needs rotating.
        if: steps.token_check.outputs.token_state == 'invalid'
        env:
          REPO: ${{ github.repository }}
          TOKEN_REASON: ${{ steps.token_check.outputs.token_reason }}
        run: |-
          if [[ "$TOKEN_REASON" == "org-policy" ]]; then
            echo "::error title=Claude Code blocked by org policy::CLAUDE_CODE_OAUTH_TOKEN authenticates but is refused (HTTP 403 permission_error / oauth_org_not_allowed): the Claude organization behind it has disabled Claude subscription access for Claude Code. Rotating the same token will NOT help - it must be re-minted from an account whose org allows Claude Code. Check with 'claude auth status', then 'claude setup-token', then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${REPO}', then bump the 'expires' date on the 1Password 'Claude Code OAuth Token' item. Renovate AI review is blocked until fixed."
          else
            echo "::error title=Claude OAuth token invalid::CLAUDE_CODE_OAUTH_TOKEN failed authentication (HTTP 401 authentication_error) - it is expired or revoked. Rotate it: run 'claude setup-token', then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${REPO}', then bump the 'expires' date on the 1Password 'Claude Code OAuth Token' item. Renovate AI review is blocked until rotated."
          fi
          exit 1

      - name: Flag usage limit
        # Usage window spent before the review started: the commit status already
        # blocks the PR; go red with an annotation so the run can't be mistaken
        # for a passed review. The fix is a re-run, NOT a token rotation.
        if: steps.token_check.outputs.token_state == 'rate-limited'
        env:
          TOKEN_DETAIL: ${{ steps.token_check.outputs.token_detail }}
          TOKEN_REASON: ${{ steps.token_check.outputs.token_reason }}
        run: |-
          if [[ "$TOKEN_REASON" == "spend-cap" ]]; then
            echo "::error title=Claude spend cap reached::CLAUDE_CODE_OAUTH_TOKEN is valid, but the organization behind it has hit its monthly API SPEND CAP (HTTP 429 rate_limit_error / enforced_spend_limit_reached${TOKEN_DETAIL:+: $TOKEN_DETAIL}). Re-running will NOT help and neither will rotating the token - access does not resume until 00:00 UTC on the 1st of next month, or until the spend limit is raised at platform.claude.com/settings/billing. The review was skipped and the commit status is failing so the PR cannot auto-merge unreviewed."
          else
            echo "::error title=Claude usage limit hit::CLAUDE_CODE_OAUTH_TOKEN is valid, but the Claude subscription behind it has spent its usage window (HTTP 429 rate_limit_error${TOKEN_DETAIL:+: $TOKEN_DETAIL}). The review was skipped and the commit status is failing so the PR cannot auto-merge unreviewed. Re-run this workflow once the window resets - do NOT rotate the token. If this recurs, CI reviews are competing with interactive Claude Code sessions on the same subscription: enable extra usage or move the workflow to an API key."
          fi
          exit 1
