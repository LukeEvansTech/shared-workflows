name: Security Scans (reusable)

on:
  workflow_call:
    inputs:
      enable-checkov:
        description: Run Checkov IaC scan
        type: boolean
        default: true
      enable-trivy:
        description: Run Trivy filesystem + secret + misconfig scan
        type: boolean
        default: true
      checkov-frameworks:
        description: Comma-separated Checkov frameworks to load (kubernetes, helm, terraform, dockerfile, ...)
        type: string
        default: kubernetes,helm
      trivy-severity:
        description: Trivy severity filter
        type: string
        default: CRITICAL,HIGH,MEDIUM
      trivy-scanners:
        description: Trivy scanner classes
        type: string
        default: vuln,secret,misconfig
      trivyignore-file:
        description: Path to .trivyignore.yaml relative to repo root (file may be absent)
        type: string
        default: .trivyignore.yaml

jobs:
  checkov:
    if: ${{ inputs.enable-checkov }}
    name: Checkov (IaC Security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: ${{ inputs.checkov-frameworks }}
          output_format: sarif
          output_file_path: checkov-results.sarif
          quiet: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  trivy:
    if: ${{ inputs.enable-trivy }}
    name: Trivy (Filesystem & Secret Scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Trivy cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ hashFiles('**/go.sum', '**/package-lock.json', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
          scanners: ${{ inputs.trivy-scanners }}
          # `trivyignores` (one word, no dash) is the documented action input;
          # the action does NOT auto-discover .trivyignore.yaml.
          trivyignores: ${{ inputs.trivyignore-file }}

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
