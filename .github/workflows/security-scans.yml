name: Security Scans (reusable)

on:
  workflow_call:
    inputs:
      enable-checkov:
        description: Run Checkov IaC scan
        type: boolean
        default: true
      enable-trivy:
        description: Run Trivy filesystem + secret + misconfig scan
        type: boolean
        default: true
      checkov-frameworks:
        description: Comma-separated Checkov frameworks to load (kubernetes, helm, terraform, dockerfile, ...)
        type: string
        default: kubernetes,helm
      trivy-severity:
        description: Trivy severity filter
        type: string
        default: CRITICAL,HIGH,MEDIUM
      trivy-scanners:
        description: Trivy scanner classes
        type: string
        default: vuln,secret,misconfig
      trivyignore-file:
        description: Path to .trivyignore.yaml relative to repo root (file may be absent)
        type: string
        default: .trivyignore.yaml

# Top-level: read-only by default. Each job widens as needed.
# (Checkov CKV2_GHA_1)
permissions:
  contents: read

jobs:
  checkov:
    if: ${{ inputs.enable-checkov }}
    name: Checkov (IaC Security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Don't leave the GITHUB_TOKEN persisted in .git/config — read-only
          # checkout is enough for SARIF emit. (zizmor: artipacked)
          persist-credentials: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@9201a8e6eaa919e3444d7c4ca691896efde4f033 # v12
        with:
          directory: .
          framework: ${{ inputs.checkov-frameworks }}
          output_format: sarif
          output_file_path: checkov-results.sarif
          quiet: true
          # Visibility-aware gate. Public repos: soft_fail=true so findings don't
          # red the build — they surface in GitHub Code Scanning via the SARIF
          # upload below. Private repos have no free Code Scanning, so soft_fail
          # =false makes Checkov exit non-zero on a failed check, gating the PR
          # here instead. (Matches Trivy's exit-code behavior below.)
          soft_fail: ${{ !github.event.repository.private }}

      # Public repos only: SARIF -> Code Scanning (free on public; needs GHAS on
      # private, where this step would fail even on a clean scan). The Checkov
      # step itself is the gate on private repos.
      - name: Upload Checkov SARIF (public repos)
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Checkov result summary (private repos)
        if: ${{ always() && github.event.repository.private }}
        shell: bash
        run: |
          # Best-effort count for the job summary; the gate is the Checkov step's
          # own exit code, so a parse miss here ('?') never changes pass/fail.
          count="$(jq '[.runs[].results[]] | length' checkov-results.sarif 2>/dev/null || echo '?')"
          {
            echo "### Checkov — private-repo gate (no Code Scanning)"
            echo ""
            echo "Findings: **${count}** — see the Checkov step log for detail."
          } >> "$GITHUB_STEP_SUMMARY"

  trivy:
    if: ${{ inputs.enable-trivy }}
    name: Trivy (Filesystem & Secret Scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Don't leave the GITHUB_TOKEN persisted in .git/config — read-only
          # checkout is enough for SARIF emit. (zizmor: artipacked)
          persist-credentials: false

      - name: Set up Trivy cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ hashFiles('**/go.sum', '**/package-lock.json', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      # The trivy-action errors with "cannot find ignorefile" when trivyignores
      # points at a file that doesn't exist. Resolve to an empty value (no-op)
      # unless the configured file is actually present, so a missing
      # .trivyignore.yaml is harmless.
      - name: Resolve trivyignore (no-op when absent)
        id: trivyignore
        shell: bash
        env:
          TRIVYIGNORE: ${{ inputs.trivyignore-file }}
        run: |
          if [ -n "${TRIVYIGNORE}" ] && [ -f "${TRIVYIGNORE}" ]; then
            echo "file=${TRIVYIGNORE}" >> "$GITHUB_OUTPUT"
            echo "using trivyignore: ${TRIVYIGNORE}"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "no trivyignore at '${TRIVYIGNORE:-<unset>}' — skipping"
          fi

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
          scanners: ${{ inputs.trivy-scanners }}
          # `trivyignores` (one word, no dash) is the documented action input;
          # the action does NOT auto-discover .trivyignore.yaml. Empty = no-op.
          trivyignores: ${{ steps.trivyignore.outputs.file }}
          # Visibility-aware gate. Public: exit-code 0 (findings surface in Code
          # Scanning via the SARIF upload). Private (no free Code Scanning):
          # exit-code 1 so Trivy fails the PR on findings here instead.
          exit-code: ${{ github.event.repository.private && '1' || '0' }}

      # Public repos only: SARIF -> Code Scanning. The Trivy step's exit-code is
      # the gate on private repos (where this upload needs GHAS and would fail).
      - name: Upload Trivy SARIF (public repos)
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Trivy result summary (private repos)
        if: ${{ always() && github.event.repository.private }}
        shell: bash
        env:
          TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
        run: |
          # Best-effort count for the job summary; the gate is the Trivy step's
          # own exit code, so a parse miss here ('?') never changes pass/fail.
          count="$(jq '[.runs[].results[]] | length' trivy-results.sarif 2>/dev/null || echo '?')"
          {
            echo "### Trivy — private-repo gate (no Code Scanning)"
            echo ""
            echo "Findings (severity ${TRIVY_SEVERITY}): **${count}** — see the Trivy step log for detail."
          } >> "$GITHUB_STEP_SUMMARY"
