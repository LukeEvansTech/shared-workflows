name: Super-Linter (reusable)

on:
  workflow_call:
    inputs:
      default-branch:
        description: Branch super-linter diffs against
        type: string
        default: main
      validate-all-codebase:
        description: Lint the entire codebase, not just changed files
        type: boolean
        default: false
      soft-launch:
        description: When true, lint failures do not fail the workflow
        type: boolean
        default: true
      filter-regex-exclude:
        description: Regex of paths to exclude from linting
        type: string
        default: '(^|/)(vendor|node_modules|\.terraform|\.venv|dist|build|collections)/'
      validate-kubernetes-kubeconform:
        description: >-
          Run kubeconform against Kubernetes manifests. Defaults false because
          docs repos contain no K8s manifests. Set true on plain-K8s repos.
          Flux GitOps repos should keep this false and use
          `kustomize build | kubeconform` against a CRD-aware schema catalog
          instead, as kustomize transforms and var substitution happen outside
          super-linter. Note: super-linter v8 requires all VALIDATE_X flags
          to be the same polarity (all true or all false); mixing true/false
          is not supported. This default (false) ensures that all explicit
          VALIDATE_X env vars in the step use the exclude (false) polarity.
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          # SARIF emit / linting only needs read-only checkout. (zizmor: artipacked)
          persist-credentials: false

      - name: Install Ansible collections for syntax-check
        # ansible-lint inside super-linter runs `ansible-playbook --syntax-check`
        # on every playbook, which fails if a referenced collection can't resolve
        # (e.g. ansibleguy.opnsense.*, ansible.netcommon.cli_command). Repos that
        # ship an ansible/requirements.yml get those collections installed into
        # ansible/collections — the conventional ansible.cfg collections_path,
        # already excluded from linting via the repo's .ansible-lint exclude_paths.
        # No-ops for docs-only repos (the vast majority of callers).
        shell: bash
        run: |
          if [ -f ansible/requirements.yml ]; then
            echo "ansible/requirements.yml found — installing collections"
            # --force installs into -p even when a collection is already present
            # elsewhere on the runner (e.g. ansible.netcommon ships with the
            # hosted image, so without --force it is "skipped" and never lands
            # in ansible/collections where super-linter's container looks).
            ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections --force
          else
            echo "no ansible/requirements.yml — skipping ansible collection install"
          fi

      - name: Stage canonical markdownlint config for super-linter
        # super-linter v8 reads the markdownlint config from LINTER_RULES_PATH
        # (.github/linters) as MARKDOWN_CONFIG_FILE — it does NOT auto-discover a
        # repo-root .markdownlint.yml. Our zensical repos keep the drift-checked
        # canonical config at the repo root (read by editors, pre-commit, and the
        # docs-standard drift check), so without this step super-linter silently
        # falls back to its stricter bundled default (e.g. MD013 line-length 400).
        # Copy the root config into .github/linters and set MARKDOWN_CONFIG_FILE
        # so super-linter honours it (MD013 off, MD033/MD041/MD060 off, MD024
        # siblings-only). No-op for callers without a root .markdownlint.yml —
        # they keep super-linter's bundled default.
        shell: bash
        run: |
          if [ -f .markdownlint.yml ]; then
            mkdir -p .github/linters
            cp .markdownlint.yml .github/linters/.markdownlint.yml
            # Only point super-linter at the config when it actually exists, so
            # callers without a root .markdownlint.yml keep super-linter's default.
            echo "MARKDOWN_CONFIG_FILE=.markdownlint.yml" >> "$GITHUB_ENV"
            echo "staged root .markdownlint.yml -> .github/linters/.markdownlint.yml"
          else
            echo "no root .markdownlint.yml — super-linter will use its default markdownlint config"
          fi

      - name: Super-Linter
        uses: super-linter/super-linter@9e863354e3ff62e0727d37183162c4a88873df41 # v8
        continue-on-error: ${{ inputs.soft-launch }}
        env:
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate-all-codebase }}
          FILTER_REGEX_EXCLUDE: ${{ inputs.filter-regex-exclude }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: WARN
          SAVE_SUPER_LINTER_SUMMARY: true
          SAVE_SUPER_LINTER_OUTPUT: true
          # Biome is disabled in favor of Prettier + ESLint + Stylelint:
          # broader format coverage (Markdown/YAML/SCSS/etc.), more mature
          # plugin ecosystem. See docs/spec.md "Phase 3 — Biome decision"
          # for the rationale. A repo can re-enable per-repo via env override
          # if it ever wants Biome.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # Kubeconform is opt-in per-repo (default false): useful for plain-K8s
          # repos. Flux GitOps repos should use `kustomize build | kubeconform`
          # against a CRD-aware schema catalog. Default false keeps all
          # VALIDATE_X flags in the exclude (false) polarity — super-linter v8
          # requires consistent polarity across all VALIDATE_X env vars.
          VALIDATE_KUBERNETES_KUBECONFORM: ${{ inputs.validate-kubernetes-kubeconform }}
          # Security scanners are owned by the shared security-scans.yml
          # reusable workflow (Checkov + Trivy with SARIF → GitHub Code
          # Scanning, plus a per-repo `.trivyignore.yaml`). Disabling them
          # here avoids running the same scanners twice and keeps
          # super-linter focused on style/format. GitLeaks overlaps with
          # Trivy's secret scanner and GitHub's native secret scanning.
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_GITLEAKS: false
          # JSCPD disabled: a 2026-05-07 survey across 18 LukeEvansTech /
          # codelooks-com repos using this shared workflow found 77 unique
          # clone pairs and 0 genuine refactor candidates. The duplication
          # is overwhelmingly bjw-s app-template boilerplate, sibling-app
          # variants (e.g. sonarr/sonarr4k/sonarranime), and intra-file
          # YAML repeats — all intentional in IaC/config repos. Repos that
          # actually want copy-paste detection are better served by
          # SonarCloud / PMD-CPD at PR-diff scope.
          VALIDATE_JSCPD: false
