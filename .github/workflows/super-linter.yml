name: Super-Linter (reusable)

on:
  workflow_call:
    inputs:
      default-branch:
        description: Branch super-linter diffs against
        type: string
        default: main
      validate-all-codebase:
        description: Lint the entire codebase, not just changed files
        type: boolean
        default: false
      soft-launch:
        description: When true, lint failures do not fail the workflow
        type: boolean
        default: true
      filter-regex-exclude:
        description: Regex of paths to exclude from linting
        type: string
        default: '(^|/)(vendor|node_modules|\.terraform|\.venv|dist|build)/'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          # SARIF emit / linting only needs read-only checkout. (zizmor: artipacked)
          persist-credentials: false

      - name: Super-Linter
        uses: super-linter/super-linter@9e863354e3ff62e0727d37183162c4a88873df41 # v8
        continue-on-error: ${{ inputs.soft-launch }}
        env:
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate-all-codebase }}
          FILTER_REGEX_EXCLUDE: ${{ inputs.filter-regex-exclude }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: WARN
          SAVE_SUPER_LINTER_SUMMARY: true
          SAVE_SUPER_LINTER_OUTPUT: true
          # Biome is disabled in favor of Prettier + ESLint + Stylelint:
          # broader format coverage (Markdown/YAML/SCSS/etc.), more mature
          # plugin ecosystem. See docs/spec.md "Phase 3 — Biome decision"
          # for the rationale. A repo can re-enable per-repo via env override
          # if it ever wants Biome.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # Security scanners are owned by the shared security-scans.yml
          # reusable workflow (Checkov + Trivy with SARIF → GitHub Code
          # Scanning, plus a per-repo `.trivyignore.yaml`). Disabling them
          # here avoids running the same scanners twice and keeps
          # super-linter focused on style/format. GitLeaks overlaps with
          # Trivy's secret scanner and GitHub's native secret scanning.
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_GITLEAKS: false
          # JSCPD disabled: a 2026-05-07 survey across 18 LukeEvansTech /
          # codelooks-com repos using this shared workflow found 77 unique
          # clone pairs and 0 genuine refactor candidates. The duplication
          # is overwhelmingly bjw-s app-template boilerplate, sibling-app
          # variants (e.g. sonarr/sonarr4k/sonarranime), and intra-file
          # YAML repeats — all intentional in IaC/config repos. Repos that
          # actually want copy-paste detection are better served by
          # SonarCloud / PMD-CPD at PR-diff scope.
          VALIDATE_JSCPD: false
