name: Super-Linter (reusable)

on:
  workflow_call:
    inputs:
      default-branch:
        description: Branch super-linter diffs against
        type: string
        default: main
      validate-all-codebase:
        description: Lint the entire codebase, not just changed files
        type: boolean
        default: false
      soft-launch:
        description: When true, lint failures do not fail the workflow
        type: boolean
        default: true
      filter-regex-exclude:
        description: >-
          Regex of paths to exclude from linting. Default skips vendored /
          generated dirs (vendor, node_modules, .terraform, .venv, dist, build,
          collections) and docs/superpowers/ — internal agent planning artifacts
          (specs/plans from the brainstorming/writing-plans workflow), not
          published product docs (those live under docs/ and are governed by
          docs.yml / docs-standard-check.yml).
        type: string
        default: '(^|/)(vendor|node_modules|\.terraform|\.venv|dist|build|collections)/|(^|/)docs/superpowers/'
      validate-go:
        description: >-
          Run super-linter's GO linter (golangci-lint over the changed .go
          files). Default true. Set false on Go repos with more than one
          package: super-linter passes the changed files as a flat list, and
          golangci-lint rejects that with "named files must all be in one
          directory" whenever a PR touches two packages. Repos that disable
          this should lint Go in their own CI (`golangci-lint run ./...`),
          which is not subject to the same restriction.
        type: boolean
        default: true
      validate-go-modules:
        description: >-
          Run super-linter's GO_MODULES linter (golangci-lint against each
          directory holding a go.mod). Default true. Set false on Go repos whose
          module root contains no .go files — the conventional cmd/ layout —
          where golangci-lint aborts with "no go files to analyze" before
          linting anything. That fires on every PR touching go.mod, i.e. every
          Renovate Go bump, and because soft-launch only covers the job, the
          per-linter commit status fails underneath a green `lint / lint`.
        type: boolean
        default: true
      validate-kubernetes-kubeconform:
        description: >-
          Run kubeconform against Kubernetes manifests. Defaults false because
          docs repos contain no K8s manifests. Set true on plain-K8s repos.
          Flux GitOps repos should keep this false and use
          `kustomize build | kubeconform` against a CRD-aware schema catalog
          instead, as kustomize transforms and var substitution happen outside
          super-linter. Note: super-linter v8 requires all VALIDATE_X flags
          to be the same polarity (all true or all false); mixing true/false
          is not supported. This default (false) ensures that all explicit
          VALIDATE_X env vars in the step use the exclude (false) polarity.
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # SARIF emit / linting only needs read-only checkout. (zizmor: artipacked)
          persist-credentials: false

      - name: Install Ansible collections for syntax-check
        # ansible-lint inside super-linter runs `ansible-playbook --syntax-check`
        # on every playbook, which fails if a referenced collection can't resolve
        # (e.g. ansibleguy.opnsense.*, ansible.netcommon.cli_command). Repos that
        # ship an ansible/requirements.yml get those collections installed into
        # ansible/collections — the conventional ansible.cfg collections_path,
        # already excluded from linting via the repo's .ansible-lint exclude_paths.
        # No-ops for docs-only repos (the vast majority of callers).
        shell: bash
        run: |
          if [ -f ansible/requirements.yml ]; then
            echo "ansible/requirements.yml found — installing collections"
            # --force installs into -p even when a collection is already present
            # elsewhere on the runner (e.g. ansible.netcommon ships with the
            # hosted image, so without --force it is "skipped" and never lands
            # in ansible/collections where super-linter's container looks).
            ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections --force
          else
            echo "no ansible/requirements.yml — skipping ansible collection install"
          fi

      - name: Stage canonical markdownlint config for super-linter
        # super-linter v8 reads the markdownlint config from LINTER_RULES_PATH
        # (.github/linters) as MARKDOWN_CONFIG_FILE — it does NOT auto-discover a
        # repo-root .markdownlint.yml. Our zensical repos keep the drift-checked
        # canonical config at the repo root (read by editors, pre-commit, and the
        # docs-standard drift check), so without this step super-linter silently
        # falls back to its stricter bundled default (e.g. MD013 line-length 400).
        # Copy the root config into .github/linters and set MARKDOWN_CONFIG_FILE
        # so super-linter honours it (MD013 off, MD033/MD041/MD060 off, MD024
        # siblings-only). No-op for callers without a root .markdownlint.yml —
        # they keep super-linter's bundled default.
        shell: bash
        run: |
          if [ -f .markdownlint.yml ]; then
            mkdir -p .github/linters
            cp .markdownlint.yml .github/linters/.markdownlint.yml
            # Only point super-linter at the config when it actually exists, so
            # callers without a root .markdownlint.yml keep super-linter's default.
            echo "MARKDOWN_CONFIG_FILE=.markdownlint.yml" >> "$GITHUB_ENV"
            echo "staged root .markdownlint.yml -> .github/linters/.markdownlint.yml"
          else
            echo "no root .markdownlint.yml — super-linter will use its default markdownlint config"
          fi

      - name: Stage shared htmlhint config for super-linter
        # htmlhint's bundled super-linter default is unusable on any repo that
        # serves server-side templates or uses a utility CSS framework. A
        # full-codebase pass over the six HTML-bearing callers (2026-08-17)
        # produced 3,207 findings, of which 7 were genuine. The rest came from
        # rules that the code *cannot* satisfy:
        #
        #   id-class-value (3,207 -> "dash")  Requires class values be lowercase
        #     and dash-split. Tailwind utilities (`hover:text-gray-200`, `md:w-1/2`)
        #     contain colons, slashes and digits and can never comply. 2,627 of
        #     the findings are this one rule.
        #   doctype-first / title-require      Fire on every template *partial*,
        #     which by definition has no <!doctype> and no <title>.
        #   spec-char-escape / tag-pair /      htmlhint is a static HTML parser. It
        #   attr-value-double-quotes           reads `{{ var }}` and `{% if %}` as
        #     markup, so Jinja/Liquid/Hugo interpolation registers as unescaped
        #     characters, unbalanced tags, and bogus attribute names (it reported
        #     `transaction.bundle_id` and `include.hidden` as attributes).
        #   space-tab-mixed-disabled           Indentation. HTML_PRETTIER owns
        #     formatting; this is duplicate and conflicting authority.
        #   head-script-disabled               Inline <head> scripts are the correct
        #     implementation for theme-flash prevention and analytics snippets.
        #
        # This is the JSCPD situation: the rule is wrong for the codebase, not the
        # codebase wrong for the rule. Disabling HTML wholesale was the alternative
        # and it was rejected — the retained rules found 2 missing `alt` attributes
        # and a duplicate `id` in hugo-communityspeakers that the 968 lines of
        # Tailwind noise in that same repo had buried.
        #
        # Correctness and accessibility rules stay ON: tagname-lowercase,
        # attr-lowercase, attr-no-duplication, id-unique, src-not-empty,
        # alt-require, doctype-html5, attr-unsafe-chars.
        #
        # A caller that ships its own .github/linters/.htmlhintrc keeps it — this
        # only fills the gap, it never overwrites.
        shell: bash
        run: |
          if [ -f .github/linters/.htmlhintrc ]; then
            echo "caller provides .github/linters/.htmlhintrc — leaving it alone"
          else
            mkdir -p .github/linters
            cat > .github/linters/.htmlhintrc <<'HTMLHINTRC'
          {
            "tagname-lowercase": true,
            "attr-lowercase": true,
            "attr-value-double-quotes": false,
            "attr-value-not-empty": false,
            "attr-no-duplication": true,
            "doctype-first": false,
            "tag-pair": false,
            "tag-self-close": false,
            "spec-char-escape": false,
            "id-unique": true,
            "src-not-empty": true,
            "title-require": false,
            "alt-require": true,
            "doctype-html5": true,
            "id-class-value": false,
            "style-disabled": false,
            "inline-style-disabled": false,
            "inline-script-disabled": false,
            "space-tab-mixed-disabled": false,
            "id-class-ad-disabled": false,
            "href-abs-or-rel": false,
            "attr-unsafe-chars": true,
            "head-script-disabled": false
          }
          HTMLHINTRC
            echo "staged shared .htmlhintrc -> .github/linters/.htmlhintrc"
          fi

      - name: Stage shared pylint config for super-linter
        # super-linter's bundled default .python-lint disables exactly one rule
        # (import-error, because it never installs caller dependencies) and
        # otherwise runs pylint wide open. A full-codebase pass over the four
        # Python callers (2026-08-18) produced 780 findings. Most are not defects
        # — they are pylint duplicating or contradicting the other linters that
        # run in this very same job, or enforcing house style pylint has no
        # standing to decide:
        #
        #   C0411 wrong-import-order (135)   isort runs in this job and owns
        #   C0413 wrong-import-position (33) import order. C0413 additionally
        #     fires on the conftest.py idiom of configuring settings/env before
        #     importing application modules, which is deliberate and required.
        #   C0301 line-too-long (23)         black runs in this job and owns
        #     code width. Two authorities on the same byte is a conflict.
        #   C0114/C0115/C0116 (204)          Missing module/class/function
        #     docstrings. Pedantic on typed code; ruff's default set does not
        #     enable pydocstyle either. Biggest single block after import order.
        #   R0903 too-few-public-methods (69) Fires on every Pydantic model,
        #     SQLAlchemy model, dataclass and config holder. Structurally
        #     unsatisfiable for the estate's FastAPI/SQLAlchemy repos.
        #   C0415 import-outside-toplevel (40) Deferred imports here are
        #     deliberate: lazy-loading heavy deps (uvicorn in a serve command),
        #     breaking import cycles, and `import traceback` inside an except.
        #   W0613 unused-argument (34)       Framework-mandated signatures.
        #     Every instance is a FastAPI `request`, a `Depends()` guard whose
        #     value is unused because the enforcement is the side effect, an
        #     ASGI lifespan `app`, a SQLAlchemy `connection_record`, or a pytest
        #     fixture requested for its side effect.
        #   R0902/R0911/R0912/R0913/R0914/   Complexity metrics (too-many-*).
        #   R0915/R0917/R1702 (74)           Arbitrary thresholds, no defect
        #     implied; flake8 and ruff do not enable their equivalents.
        #   C0103 invalid-name               CLI scripts use hyphenated names.
        #   C1803 / R0801 / R1724 / W1510    Carried over from this repo's own
        #     .python-lint, where each is justified in situ. R0801 duplicate-code
        #     is disabled fleet-wide (JSCPD survey 2026-05-07: 0 genuine).
        #
        # That clears 617 of 780. The 163 that remain are genuine and fixable —
        # bare-except, broad-exception-caught, raise-missing-from, unused
        # variables/imports, unspecified-encoding, singleton-comparison,
        # redefined-builtin, global-statement — and are deliberately left ON.
        #
        # W0621 redefined-outer-name is the notable keep. 57 of its 69 hits are
        # the pytest fixture idiom (harmless) but the other 12 are real shadowing
        # in application code — a function parameter masking the module-level
        # `app`, a script masking its own `db` handle. A blanket disable would
        # hide those, so test modules should carry a file-level
        # `# pylint: disable=redefined-outer-name` instead.
        #
        # NOTE: this config is NOT this repo's own .github/linters/.python-lint
        # copied over. That file omits `import-error`, which is safe here (these
        # scripts are stdlib + pytest) but catastrophic for callers: copying it
        # verbatim added 60 fresh E0401 findings to loupe alone, because
        # super-linter does not install caller dependencies.
        #
        # A caller that ships its own .github/linters/.python-lint keeps it —
        # this only fills the gap, it never overwrites.
        shell: bash
        run: |
          if [ -f .github/linters/.python-lint ]; then
            echo "caller provides .github/linters/.python-lint — leaving it alone"
          else
            mkdir -p .github/linters
            cat > .github/linters/.python-lint <<'PYLINTRC'
          [MASTER]
          jobs = 0

          [MESSAGES CONTROL]
          disable =
              import-error,
              C0103,
              C0114,
              C0115,
              C0116,
              C0301,
              C0411,
              C0413,
              C0415,
              C1803,
              R0801,
              R0902,
              R0903,
              R0911,
              R0912,
              R0913,
              R0914,
              R0915,
              R0917,
              R1702,
              R1724,
              W0613,
              W1510
          PYLINTRC
            echo "staged shared .python-lint -> .github/linters/.python-lint"
          fi

      - name: Super-Linter
        uses: super-linter/super-linter@9e863354e3ff62e0727d37183162c4a88873df41 # v8.6.0
        continue-on-error: ${{ inputs.soft-launch }}
        env:
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate-all-codebase }}
          FILTER_REGEX_EXCLUDE: ${{ inputs.filter-regex-exclude }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: WARN
          SAVE_SUPER_LINTER_SUMMARY: true
          SAVE_SUPER_LINTER_OUTPUT: true
          # Biome is disabled in favor of Prettier + ESLint + Stylelint:
          # broader format coverage (Markdown/YAML/SCSS/etc.), more mature
          # plugin ecosystem. See docs/spec.md "Phase 3 — Biome decision"
          # for the rationale. A repo can re-enable per-repo via env override
          # if it ever wants Biome.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # Kubeconform is opt-in per-repo (default false): useful for plain-K8s
          # repos. Flux GitOps repos should use `kustomize build | kubeconform`
          # against a CRD-aware schema catalog.
          # The three flags below emit '' (not 'true') when enabled. super-linter's
          # GetValidationInfo() treats an empty VALIDATE_* as UNSET
          # (`[ -n "${!VALIDATE_LANGUAGE:-}" ]`) and then defaults unset
          # linters to ANY_FALSE — enabled, given every other flag here is
          # false. Emitting a literal 'true' would set ANY_TRUE alongside
          # ANY_FALSE and super-linter hard-errors: "Behavior not supported,
          # please either only include (VALIDATE=true) or exclude
          # (VALIDATE=false) linters, but not both".
          #
          # The condition is inverted deliberately. GitHub Actions treats the
          # empty string as FALSY, so the natural-looking
          #   ${{ inputs.x && '' || 'false' }}
          # collapses to 'false' in BOTH branches. Do not "simplify" it back.
          VALIDATE_GO: ${{ !inputs.validate-go && 'false' || '' }}
          VALIDATE_GO_MODULES: ${{ !inputs.validate-go-modules && 'false' || '' }}
          VALIDATE_KUBERNETES_KUBECONFORM: ${{ !inputs.validate-kubernetes-kubeconform && 'false' || '' }}
          # Security scanners are owned by the shared security-scans.yml
          # reusable workflow (Checkov + Trivy with SARIF → GitHub Code
          # Scanning, plus a per-repo `.trivyignore.yaml`). Disabling them
          # here avoids running the same scanners twice and keeps
          # super-linter focused on style/format. GitLeaks overlaps with
          # Trivy's secret scanner and GitHub's native secret scanning.
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_GITLEAKS: false
          # JSCPD disabled: a 2026-05-07 survey across 18 LukeEvansTech /
          # codelooks-com repos using this shared workflow found 77 unique
          # clone pairs and 0 genuine refactor candidates. The duplication
          # is overwhelmingly bjw-s app-template boilerplate, sibling-app
          # variants (e.g. sonarr/sonarr4k/sonarranime), and intra-file
          # YAML repeats — all intentional in IaC/config repos. Repos that
          # actually want copy-paste detection are better served by
          # SonarCloud / PMD-CPD at PR-diff scope.
          VALIDATE_JSCPD: false
          # dotenv-linter (ENV) is disabled fleet-wide: it is fundamentally
          # incompatible with the standard terraform-* .env.example shape.
          # `TF_VAR_<name>` keys MUST keep the variable's real (lowercase) name —
          # dotenv-linter's LowercaseKey flags them, and uppercasing breaks
          # Terraform (unfixable in-file). 1Password `op://Vault Name/Item/...`
          # values also trip ValueWithoutQuotes (spaces in vault/item names),
          # and UnorderedKey fights the logical TF_VAR_*/AWS_* grouping. ENV is
          # a style-only linter with no safe fix for this convention, so it is
          # off. Keeps every VALIDATE_* in the exclude (false) polarity that
          # super-linter v8 requires.
          VALIDATE_ENV: false
          # PYTHON_RUFF_FORMAT is disabled: black and ruff format are BOTH
          # enabled by default and they are not reconcilable, so a Python
          # caller cannot make both green. super-linter says so itself on every
          # run — "Black and Ruff are both enabled, and might conflict with each
          # other. To avoid potential conflicts, keep only one of the two
          # enabled, and disable the other."
          #
          # It is not merely a line-length mismatch (black's config here is
          # empty, so 88; .ruff.toml sets 120). Measured on LukeEvansTech/loupe,
          # 28 files:
          #   black then ruff format  -> ruff reformats 11 of black's 16 files,
          #                              and `black --check` then fails
          #   both pinned to 120      -> still disagree on 1 file
          # So matching the widths narrows it but does not close it. Whichever
          # formatter runs last wins and the other's linter fails, permanently.
          #
          # Black is kept because the estate already treats it as the authority
          # on code width (see this repo's own .github/linters/.flake8 and
          # .python-lint). PYTHON_RUFF — the *linter* — stays enabled; only the
          # overlapping formatter goes.
          VALIDATE_PYTHON_RUFF_FORMAT: false
          # HTML_PRETTIER is disabled: prettier CORRUPTS server-side templates.
          # This is not a style disagreement — it silently rewrites application
          # logic. prettier's HTML parser reads a Jinja/Liquid/Hugo expression
          # inside a tag as a list of HTML attributes and normalises it.
          # Measured on LukeEvansTech/loupe, templates/history.html:
          #
          #   before: <option value="pass" {% if verdict == 'pass' %}selected{% endif %}>
          #   after:  <option value="pass" {% if verdict="" ="pass" %}selected{% endif %}>
          #
          # `verdict`, `==` and `'pass'` were treated as three attributes and
          # `verdict` was given an empty value. The template stops parsing
          # (jinja2: "expected token 'end of statement block', got '='"), so the
          # history page's verdict filter breaks outright. Six templates were
          # run through it; one was corrupted this way and the rest were merely
          # reflowed.
          #
          # The danger is the direction of the failure: the linter reports
          # "Code style issues found. Run Prettier with --write to fix", and
          # doing exactly what it says is what breaks the app. Six repos in this
          # estate serve Jinja, Liquid or Hugo templates.
          #
          # HTML (htmlhint) stays enabled — with the shared .htmlhintrc staged
          # above it still catches real accessibility and correctness bugs.
          # Repos with genuinely static HTML that want prettier formatting can
          # run it in their own CI, where the file set is theirs to control.
          VALIDATE_HTML_PRETTIER: false
