name: Lint (self-test)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Top-level: read-only by default.
permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: ./.github/workflows/super-linter.yml
