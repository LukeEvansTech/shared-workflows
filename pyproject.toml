# Tooling config only. shared-workflows is not a Python package — this just
# standardizes formatter/linter settings so the self-lint (super-linter) can
# graduate from soft-launch to blocking. Line width is black's default (88),
# matched by ruff-format and isort (profile=black).
[tool.isort]
profile = "black"

[tool.ruff.lint]
# E402: helper/test scripts intentionally sys.path-insert before importing
# sibling modules (zensical_drift, audit_zensical_standard).
ignore = ["E402"]
